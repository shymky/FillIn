version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fillin-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fillin-network

  api:
    build: .
    container_name: fillin-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite:///./data/fillin.db
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - ollama
    networks:
      - fillin-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ollama_data:

networks:
  fillin-network:
    driver: bridge
